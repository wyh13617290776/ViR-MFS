model_name: "SegFormer"

backbone:
  phi: "b0"
  pretrained_dir: "model_data"

dataset:
  name: "FMB"
  root_dir: "../datasets"

train:
  save_base_dir: "runs"

test:
  save_base_dir: "test_results"
